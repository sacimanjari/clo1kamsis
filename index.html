              <h1 className="text-2xl font-extrabold text-slate-900">Dashboard Konten Sekolah</h1>
            </div>
            <div className="flex gap-2">
              <button 
                onClick={() => setIsAuthenticated(false)}
                className="px-4 py-2 bg-slate-100 hover:bg-rose-50 hover:text-rose-600 text-slate-700 font-bold text-xs rounded-xl transition"
              >
                Keluar
              </button>
            </div>
          </div>

          {/* Quick Metrics */}
          <div className="grid grid-cols-3 gap-4 mb-8">
            <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
              <p className="text-xs font-semibold text-slate-500">Jumlah Ekskul</p>
              <p className="text-3xl font-extrabold text-slate-900 mt-1">{ekskul.length}</p>
            </div>
            <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
              <p className="text-xs font-semibold text-slate-500">Peluang Aktif</p>
              <p className="text-3xl font-extrabold text-brand-600 mt-1">{peluang.length}</p>
            </div>
            <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
              <p className="text-xs font-semibold text-slate-500">Feedback Masuk</p>
              <p className="text-3xl font-extrabold text-slate-900 mt-1">{feedbacks.length}</p>
            </div>
          </div>

          {/* Tabs */}
          <div className="flex gap-2 border-b border-slate-200 pb-3 mb-6">
            <button 
              onClick={() => setAdminTab('overview')}
              className={`px-4 py-2 rounded-xl text-xs font-bold ${adminTab === 'overview' ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}`}
            >
              Ringkasan Data
            </button>
            <button 
              onClick={() => setAdminTab('ekskul')}
              className={`px-4 py-2 rounded-xl text-xs font-bold ${adminTab === 'ekskul' ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}`}
            >
              Kelola Ekskul ({ekskul.length})
            </button>
            <button 
              onClick={() => setAdminTab('peluang')}
              className={`px-4 py-2 rounded-xl text-xs font-bold ${adminTab === 'peluang' ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}`}
            >
              Kelola Peluang ({peluang.length})
            </button>
            <button 
              onClick={() => setAdminTab('feedback')}
              className={`px-4 py-2 rounded-xl text-xs font-bold ${adminTab === 'feedback' ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}`}
            >
              Pesan Masuk ({feedbacks.length})
            </button>
          </div>

          {/* TAB 1: EKSKUL */}
          {adminTab === 'ekskul' && (
            <div className="space-y-6">
              <form onSubmit={handleAddEkskul} className="bg-white p-4 rounded-2xl border border-slate-200 flex gap-3 items-center">
                <input 
                  type="text" 
                  placeholder="Nama ekskul baru..." 
                  value={newEkskulName}
                  onChange={(e) => setNewEkskulName(e.target.value)}
                  className="flex-1 px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl"
                />
                <select 
                  value={newEkskulCat} 
                  onChange={(e) => setNewEkskulCat(e.target.value)}
                  className="px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl"
                >
                  <option value="Olahraga">Olahraga</option>
                  <option value="Seni">Seni</option>
                  <option value="Akademik">Akademik</option>
                  <option value="Organisasi">Organisasi</option>
                  <option value="Bahasa">Bahasa</option>
                </select>
                <button type="submit" className="px-4 py-2 bg-brand-600 text-white text-xs font-bold rounded-xl hover:bg-brand-700">
                  + Tambah Ekskul
                </button>
              </form>

              <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                <table className="w-full text-left text-sm">
                  <thead className="bg-slate-50 text-slate-500 text-xs font-bold border-b border-slate-200">
                    <tr>
                      <th className="p-4">Nama Ekskul</th>
                      <th className="p-4">Kategori</th>
                      <th className="p-4">Jadwal</th>
                      <th className="p-4 text-right">Aksi</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {ekskul.map(item => (
                      <tr key={item.id} className="hover:bg-slate-50">
                        <td className="p-4 font-bold text-slate-800">{item.name}</td>
                        <td className="p-4 text-slate-500">{item.category}</td>
                        <td className="p-4 text-slate-500 text-xs">{item.schedule}</td>
                        <td className="p-4 text-right">
                          <button 
                            onClick={() => handleDeleteEkskul(item.id)}
                            className="text-xs text-rose-600 hover:text-rose-800 font-bold px-2 py-1 rounded bg-rose-50"
                          >
                            Hapus
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* TAB 2: PELUANG */}
          {adminTab === 'peluang' && (
            <div className="space-y-6">
              <form onSubmit={handleAddPeluang} className="bg-white p-4 rounded-2xl border border-slate-200 flex gap-3 items-center">
                <input 
                  type="text" 
                  placeholder="Judul lomba / beasiswa baru..." 
                  value={newPeluangTitle}
                  onChange={(e) => setNewPeluangTitle(e.target.value)}
                  className="flex-1 px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl"
                />
                <select 
                  value={newPeluangCat} 
                  onChange={(e) => setNewPeluangCat(e.target.value)}
                  className="px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl"
                >
                  <option value="Lomba">Lomba</option>
                  <option value="Pelatihan">Pelatihan</option>
                  <option value="Volunteer">Volunteer</option>
                  <option value="Beasiswa">Beasiswa</option>
                </select>
                <button type="submit" className="px-4 py-2 bg-brand-600 text-white text-xs font-bold rounded-xl hover:bg-brand-700">
                  + Tambah Peluang
                </button>
              </form>

              <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                <table className="w-full text-left text-sm">
                  <thead className="bg-slate-50 text-slate-500 text-xs font-bold border-b border-slate-200">
                    <tr>
                      <th className="p-4">Nama Peluang</th>
                      <th className="p-4">Kategori</th>
                      <th className="p-4">Deadline</th>
                      <th className="p-4 text-right">Aksi</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {peluang.map(item => (
                      <tr key={item.id} className="hover:bg-slate-50">
                        <td className="p-4 font-bold text-slate-800">{item.title}</td>
                        <td className="p-4 text-slate-500">{item.category}</td>
                        <td className="p-4 text-slate-500 text-xs">{item.deadline}</td>
                        <td className="p-4 text-right">
                          <button 
                            onClick={() => handleDeletePeluang(item.id)}
                            className="text-xs text-rose-600 hover:text-rose-800 font-bold px-2 py-1 rounded bg-rose-50"
                          >
                            Hapus
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* TAB 3: FEEDBACK */}
          {adminTab === 'feedback' && (
            <div className="bg-white rounded-2xl border border-slate-200 divide-y divide-slate-100">
              {feedbacks.map(f => (
                <div key={f.id} className="p-5">
                  <div className="flex justify-between items-center mb-1">
                    <span className="font-bold text-slate-900 text-sm">{f.name}</span>
                    <span className="text-[11px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">{f.type}</span>
                  </div>
                  <p className="text-slate-600 text-sm mt-1">{f.text}</p>
                  <span className="text-[10px] text-slate-400 mt-2 block">{f.date}</span>
                </div>
              ))}
            </div>
          )}

          {/* TAB 4: OVERVIEW */}
          {adminTab === 'overview' && (
            <div className="bg-white rounded-3xl p-6 border border-slate-200 space-y-4">
              <h3 className="font-bold text-slate-900">Panduan Demo Presentasi</h3>
              <p className="text-sm text-slate-600 leading-relaxed">
                Halaman admin ini mendemonstrasikan bahwa pihak OSIS atau perwakilan guru sekolah dapat memperbarui konten ekskul, menambah info lomba baru, dan meninjau aspirasi siswa secara mandiri tanpa coding tambahan.
              </p>
              <div className="p-4 bg-brand-50 rounded-2xl text-xs text-brand-800 font-medium">
                💡 <strong>Tips Demo:</strong> Tunjukkan flow dari halaman depan (siswa mencari ekskul/peluang), lalu buka tab admin ini untuk memperlihatkan bagaimana data dikelola dari sisi panitia sekolah.
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
