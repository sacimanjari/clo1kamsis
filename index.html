<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoring Sempadan Pantai Bali - Web GIS</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    #map { height: calc(100vh - 65px); }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased overflow-hidden">

  <!-- Header -->
  <header class="h-[65px] bg-slate-900 text-white px-6 flex items-center justify-between shadow-md z-20 relative">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-lg bg-teal-500/20 border border-teal-500/40 flex items-center justify-center text-teal-400">
        <i class="fa-solid fa-water text-lg"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-tight">Sistem Monitoring Sempadan Pantai Bali</h1>
        <p class="text-xs text-slate-400">Pengawasan Buffer 100m Akomodasi Pesisir</p>
      </div>
    </div>
    
    <div class="flex items-center gap-3">
      <input type="file" id="json-file-input" accept=".json" class="hidden" />
      <button onclick="document.getElementById('json-file-input').click()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-md border border-slate-700 transition flex items-center gap-1.5">
        <i class="fa-solid fa-file-code"></i> Pilih File JSON Manual
      </button>

      <button onclick="resetMapView()" class="text-xs bg-teal-600 hover:bg-teal-500 text-white px-3 py-1.5 rounded-md font-medium transition shadow-sm">
        <i class="fa-solid fa-arrows-to-dot mr-1"></i> Reset Peta
      </button>
    </div>
  </header>

  <!-- Layout Utama -->
  <div class="flex flex-col md:flex-row h-[calc(100vh-65px)]">

    <!-- Panel Sidebar -->
    <aside class="w-full md:w-96 bg-white border-r border-slate-200 flex flex-col z-10 shadow-lg md:shadow-none">
      
      <!-- Statistik -->
      <div class="p-4 border-b border-slate-100 bg-slate-50/70">
        <div class="grid grid-cols-2 gap-2 text-center">
          <div class="p-2.5 bg-white rounded-lg border border-slate-200 shadow-sm">
            <span class="text-xs text-slate-500 block">Total Terpantau</span>
            <span id="stat-total" class="text-xl font-bold text-slate-800">0</span>
          </div>
          <div class="p-2.5 bg-rose-50 rounded-lg border border-rose-200 shadow-sm">
            <span class="text-xs text-rose-600 block">Dekat Sempadan</span>
            <span id="stat-sempadan" class="text-xl font-bold text-rose-700">0</span>
          </div>
        </div>
      </div>

      <!-- Filter & Search -->
      <div class="p-4 border-b border-slate-200 space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Pencarian Objek / Alamat</label>
          <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-400"></i>
            <input 
              id="search-input"
              type="text" 
              placeholder="Cari hotel, Lovina, Sanur, Kuta..."
              class="w-full pl-8 pr-3 py-1.5 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Filter Tipe Usaha</label>
          <select 
            id="type-filter" 
            class="w-full text-sm rounded-lg border border-slate-300 py-1.5 px-3 focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 bg-white"
          >
            <option value="all">Semua Tipe Usaha</option>
            <option value="hotel">Hotel</option>
            <option value="resort">Resort</option>
            <option value="guest_house">Guest House / Villa</option>
            <option value="restaurant">Restaurant</option>
            <option value="bar">Bar / Beach Club</option>
          </select>
        </div>
      </div>

      <!-- Daftar Kartu -->
      <div class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-2" id="item-list">
        <div class="p-4 text-center text-xs text-slate-400" id="loading-state">
          <i class="fa-solid fa-circle-notch fa-spin text-teal-600 text-lg mb-2 block"></i>
          Memuat dataset JSON...
        </div>
      </div>
      
      <!-- Footer Status -->
      <div class="p-2.5 border-t border-slate-200 text-[11px] text-slate-500 text-center bg-slate-50" id="list-status">
        Memuat data
      </div>
    </aside>

    <!-- Canvas Peta Leaflet -->
    <main class="flex-1 relative">
      <div id="map" class="w-full h-full"></div>

      <!-- Legenda -->
      <div class="absolute bottom-6 right-6 bg-white/95 backdrop-blur-sm p-3.5 rounded-xl border border-slate-200 shadow-xl z-[1000] text-xs">
        <p class="font-semibold text-slate-700 mb-2 flex items-center gap-1.5">
          <i class="fa-solid fa-layer-group text-slate-500"></i> Kategori Usaha
        </p>
        <div class="space-y-1.5">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span>
            <span>Hotel</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
            <span>Resort</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span>
            <span>Guest House / Villa</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-purple-500 inline-block"></span>
            <span>Restaurant</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-rose-500 inline-block"></span>
            <span>Bar / Beach Club</span>
          </div>
        </div>
      </div>
    </main>

  </div>

  <script>
    let rawData = [];

    const typeConfig = {
      hotel:       { color: '#3b82f6', label: 'Hotel', icon: 'fa-hotel' },
      resort:      { color: '#10b981', label: 'Resort', icon: 'fa-umbrella-beach' },
      guest_house: { color: '#f59e0b', label: 'Guest House / Villa', icon: 'fa-house-user' },
      restaurant:  { color: '#a855f7', label: 'Restaurant', icon: 'fa-utensils' },
      bar:         { color: '#f43f5e', label: 'Bar / Beach Club', icon: 'fa-martini-glass-citrus' }
    };

    // Inisialisasi Peta
    const baliCenter = [-8.5000, 115.1889];
    const map = L.map('map', { zoomControl: false }).setView(baliCenter, 10);

    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors | Monitoring Sempadan Bali',
      maxZoom: 19
    }).addTo(map);

    // Marker Cluster Group
    const markerCluster = L.markerClusterGroup({
      showCoverageOnHover: false,
      maxClusterRadius: 40,
      chunkedLoading: true
    });
    map.addLayer(markerCluster);

    function createCustomMarker(item) {
      const lat = parseFloat(item.Latitude);
      const lng = parseFloat(item.Longitude);
      const cfg = typeConfig[item.Tipe_Usaha] || { color: '#64748b', label: item.Tipe_Usaha, icon: 'fa-building' };

      const marker = L.circleMarker([lat, lng], {
        radius: 7,
        fillColor: cfg.color,
        color: '#ffffff',
        weight: 1.5,
        opacity: 1,
        fillOpacity: 0.85
      });

      const popupHtml = `
        <div class="text-xs min-w-[210px] space-y-1.5 p-1 font-sans">
          <div class="pb-1 border-b border-slate-200">
            <span class="font-bold text-slate-800 text-sm leading-tight">${item.Nama_Objek}</span>
          </div>
          <p class="text-slate-500 text-[11px]"><i class="fa-solid fa-location-dot mr-1 text-slate-400"></i>${item.Jalan_Alamat}</p>
          <div class="flex items-center gap-2 pt-1">
            <span class="px-2 py-0.5 rounded text-[10px] font-semibold text-white" style="background-color: ${cfg.color}">
              <i class="fa-solid ${cfg.icon} mr-1"></i>${cfg.label}
            </span>
          </div>
          <div class="mt-2 p-1.5 rounded bg-rose-50 border border-rose-200 text-rose-700 text-[11px] font-medium flex items-center gap-1.5">
            <i class="fa-solid fa-triangle-exclamation text-rose-500"></i>
            ${item.Status_Sempadan || 'Indikasi Dekat Sempadan Pantai'}
          </div>
        </div>
      `;

      marker.bindPopup(popupHtml);
      return marker;
    }

    function renderFilteredData() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const selectedType = document.getElementById('type-filter').value;

      markerCluster.clearLayers();
      const itemList = document.getElementById('item-list');
      itemList.innerHTML = '';

      let matchedCount = 0;
      let sempadanCount = 0;
      const markersToAdd = [];

      const filtered = rawData.filter(item => {
        if (!item.Latitude || !item.Longitude) return false;
        const matchesQuery = (item.Nama_Objek && item.Nama_Objek.toLowerCase().includes(query)) || 
                             (item.Jalan_Alamat && item.Jalan_Alamat.toLowerCase().includes(query));
        const matchesType = (selectedType === 'all') || (item.Tipe_Usaha === selectedType);
        return matchesQuery && matchesType;
      });

      matchedCount = filtered.length;

      filtered.forEach((item, index) => {
        if (item.Status_Sempadan && item.Status_Sempadan.includes('Sempadan')) {
          sempadanCount++;
        }

        const marker = createCustomMarker(item);
        markersToAdd.push(marker);

        // Tampilkan 50 data teratas di sidebar agar DOM tetap ringan dan cepat
        if (index < 50) {
          const cfg = typeConfig[item.Tipe_Usaha] || { color: '#64748b', label: item.Tipe_Usaha, icon: 'fa-building' };
          const card = document.createElement('div');
          card.className = "p-3 bg-white hover:bg-slate-50 rounded-xl border border-slate-200 shadow-sm cursor-pointer transition flex flex-col gap-1.5";
          card.innerHTML = `
            <div class="flex items-start justify-between gap-2">
              <h3 class="font-semibold text-xs text-slate-800 leading-snug">${item.Nama_Objek}</h3>
              <span class="w-2.5 h-2.5 rounded-full shrink-0 mt-0.5" style="background-color: ${cfg.color}"></span>
            </div>
            <p class="text-[11px] text-slate-500 truncate"><i class="fa-solid fa-location-dot mr-1 text-slate-400"></i>${item.Jalan_Alamat}</p>
            <div class="flex items-center justify-between text-[10px] pt-1">
              <span class="text-slate-600 font-medium"><i class="fa-solid ${cfg.icon} mr-1 text-slate-400"></i>${cfg.label}</span>
              <span class="text-rose-600 font-semibold bg-rose-50 px-1.5 py-0.5 rounded border border-rose-200">Indikasi Sempadan</span>
            </div>
          `;

          card.onclick = () => {
            const lat = parseFloat(item.Latitude);
            const lng = parseFloat(item.Longitude);
            map.flyTo([lat, lng], 16, { duration: 1.2 });
            markerCluster.zoomToShowLayer(marker, () => {
              marker.openPopup();
            });
          };

          itemList.appendChild(card);
        }
      });

      markerCluster.addLayers(markersToAdd);

      document.getElementById('stat-total').innerText = matchedCount.toLocaleString();
      document.getElementById('stat-sempadan').innerText = sempadanCount.toLocaleString();

      const listStatus = document.getElementById('list-status');
      if (matchedCount > 50) {
        listStatus.innerText = `Menampilkan 50 dari total ${matchedCount.toLocaleString()} data`;
      } else {
        listStatus.innerText = `Menampilkan ${matchedCount} data`;
      }
    }

    function processJSON(data) {
      rawData = data.filter(d => d.Nama_Objek && d.Latitude && d.Longitude);
      renderFilteredData();
      if (rawData.length > 0) {
        const sampleBounds = rawData.map(d => [parseFloat(d.Latitude), parseFloat(d.Longitude)]);
        map.fitBounds(sampleBounds, { padding: [30, 30] });
      }
    }

    // Mengambil dataset JSON secara otomatis (Ideal saat dideploy ke Vercel / server lokal)
    fetch('dataset_sempadan_pantai_bali_200plus.json')
      .then(res => {
        if (!res.ok) throw new Error('File JSON gagal dimuat.');
        return res.json();
      })
      .then(data => {
        processJSON(data);
      })
      .catch(err => {
        document.getElementById('loading-state').innerHTML = `
          <i class="fa-solid fa-folder-open text-teal-600 text-xl mb-2 block"></i>
          <span class="font-medium text-slate-700 block mb-1">Gagal fetch JSON otomatis</span>
          Gunakan tombol <b>Pilih File JSON Manual</b> di atas untuk memuat data.
        `;
      });

    // Handler jika file JSON dipilih secara manual
    document.getElementById('json-file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          try {
            const parsed = JSON.parse(event.target.result);
            processJSON(parsed);
          } catch(err) {
            alert('Format JSON tidak valid.');
          }
        };
        reader.readAsText(file);
      }
    });

    function resetMapView() {
      document.getElementById('search-input').value = '';
      document.getElementById('type-filter').value = 'all';
      renderFilteredData();
      map.flyTo(baliCenter, 10);
    }

    document.getElementById('search-input').addEventListener('input', renderFilteredData);
    document.getElementById('type-filter').addEventListener('change', renderFilteredData);
  </script>
</body>
</html>
