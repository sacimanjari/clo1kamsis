<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suku Bali — Adat, Wangsa, dan Arsitektur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#14161a;--fg:#f2efe8;--mut:#b4b2aa;--ln:#2e3238;--red:#d2382f;--gold:#dcae45;--ink:#0d0e10}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.6 Figtree,system-ui,sans-serif;overflow:hidden}
.top{position:fixed;inset:0 0 auto;height:10px;z-index:5;background:linear-gradient(90deg,#0d0e10 0 33.3%,#f2efe8 0 66.6%,var(--red) 0)}
#bar{position:fixed;top:10px;left:0;height:3px;background:var(--gold);z-index:5;transition:width .3s}
.s{position:absolute;inset:0;padding:9vh 8vw 13vh;display:flex;flex-direction:column;gap:2.2vh;overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.s.on{opacity:1;visibility:visible}
.k{display:flex;align-items:center;gap:10px;color:var(--gold);font-size:.9rem;font-weight:600}
.k:before{content:"";width:14px;height:14px;background:conic-gradient(#0d0e10 25%,#f2efe8 0 50%,#0d0e10 0 75%,#f2efe8 0) 0 0/14px 14px;outline:1px solid var(--ln)}
h2{font:400 clamp(1.9rem,4.8vw,3.6rem)/1.08 Gloock,Georgia,serif;max-width:20ch}
.l{max-width:62ch;color:var(--mut);font-size:clamp(1rem,1.5vw,1.2rem)}
.g{display:grid;gap:18px 28px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:1.2vh;max-width:1100px}
.c{border-left:3px solid var(--gold);padding:2px 0 2px 16px}
.c b{display:block;font:400 1.25rem/1.25 Gloock,Georgia,serif;margin-bottom:5px}
.c p{color:var(--mut);font-size:.97rem}
.n{max-width:62ch;color:var(--gold);font-size:.95rem}
.two{grid-template-columns:1fr 1fr}
.two .c:first-child{border-color:var(--red)}
.st .c{border:0;border-top:1px solid var(--ln);padding:12px 0 0}
.st .c b{font-size:clamp(2.2rem,5vw,3.6rem);color:var(--gold)}
.hero h2{font-size:clamp(3.6rem,13vw,9rem);max-width:none}
.hero:after{content:"";position:absolute;right:0;top:10px;bottom:0;width:min(26vw,320px);background:conic-gradient(#0d0e10 25%,#f2efe8 0 50%,#0d0e10 0 75%,#f2efe8 0) 0 0/64px 64px;opacity:.9;-webkit-mask:linear-gradient(90deg,transparent,#000 70%);mask:linear-gradient(90deg,transparent,#000 70%)}
.warn{background:var(--red);color:#fff}
.warn .k,.warn .n{color:#fff}.warn .l,.warn .c p{color:#ffe3df}.warn .c{border-color:#fff}
.warn h2{font-size:clamp(2.6rem,8vw,6rem);max-width:14ch}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 8vw;z-index:5;background:linear-gradient(transparent,var(--bg) 60%)}
nav span{color:var(--mut);font-size:.9rem}
button{background:none;color:var(--fg);border:1px solid var(--mut);padding:8px 18px;font:inherit;cursor:pointer}
button:hover{border-color:var(--gold);color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.s:not(.ph)>:first-child{margin-top:auto}.s:not(.ph)>:last-child{margin-bottom:auto}
.ph{flex-direction:row;align-items:flex-start;gap:5vw}
.ph>*{margin-block:auto;min-width:0}
.ph .b{flex:1 1 52%;display:flex;flex-direction:column;gap:2.2vh}
.ph .fs{flex:1 1 40%;display:flex;flex-direction:column;gap:18px}
.ph .g,.ph .two{grid-template-columns:1fr 1fr}
.fs.m{display:grid;grid-template-columns:1fr 1fr}.fs.m img{max-height:22vh}.fs.m .p0{min-height:12vh}
figure{border-bottom:3px solid var(--gold)}
figure img{width:100%;max-height:34vh;object-fit:cover;display:block}
.p0{display:grid;place-items:center;min-height:20vh;background:var(--ln);color:var(--mut);font-size:.9rem;text-align:center;padding:12px}
figcaption{font-size:.8rem;color:var(--mut);padding:6px 0}
figcaption a{color:var(--gold)}
@media(max-width:900px){.ph{flex-direction:column;align-items:stretch}.ph>*{margin-block:0}.ph>:first-child{margin-top:auto}.ph>:last-child{margin-bottom:auto}.ph .g,.ph .two{grid-template-columns:1fr}}
@media(max-width:720px){.two{grid-template-columns:1fr}.s{padding:9vh 6vw 14vh}nav{padding:12px 6vw}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

{k:"Bali Aga",i:[{q:"Bali Aga village traditional",c:"Desa Bali Aga"}],t:"Penjaga tradisi paling tua",l:"Desa-desa Bali Aga terkenal dengan aturan adat (awig-awig) yang ketat.",c:[["Desa utama","Tenganan Pegringsingan, Trunyan, Sembiran, Julah, Sidatapa, Pedawa, Bayung Gede, Cempaga"],["Ciri khas","Rumah berderet seragam, hutan dan lahan adat komunal"],["Karya budaya","Kain gringsing dari Tenganan, ritual perang pandan, pemakaman mepasah di Trunyan"]]},

{k:"Sistem kekerabatan",i:[{q:"Balinese family temple merajan",c:"Merajan, tempat suci keluarga"}],t:"Patrilineal: garis keturunan dari ayah",c:[["Purusa dan pradana","Keturunan mengikuti laki-laki (purusa). Perempuan yang menikah masuk ke keluarga suami (pradana)."],["Penerus keluarga","Anak laki-laki mewarisi merajan atau sanggah (tempat suci keluarga) dan tanggung jawab leluhur."],["Nyentana","Jika tidak punya anak laki-laki, anak perempuan bisa berstatus sentana rajeg dan suaminya masuk ke keluarga istri."],["Perkembangan","Keputusan Pesamuhan Agung MUDP Bali 2010 membuka ruang hak waris tertentu bagi perempuan."]]},
{k:"Peran perempuan",i:[{q:"canang sari Bali offering",c:"Canang sari, hasil mejejahitan"}],t:"Mejejahitan: keterampilan yang diwariskan",l:"Perempuan Bali diharapkan terampil membuat perlengkapan upacara. Ini tradisi dan ekspektasi sosial, bukan kewajiban hukum.",c:[["Mejejahitan","Menganyam janur menjadi canang, sampian, tamiang, dan penjor"],["Metanding banten","Merangkai sesajen sebelum upacara dan odalan"],["Ngayah","Bekerja bersama tanpa upah di pura dan banjar"],["Kini","Banyak perempuan berkarier, dan jasa tukang banten ikut membantu"]]},

{k:"Gotong royong",i:[{q:"kulkul Bali slit drum",c:"Kul-kul"}],t:"Banjar, sekaa, dan subak",c:[["Krama banjar","Anggota banjar yang ikut paruman (rapat) dan menjalankan kewajiban adat"],["Kul-kul","Kentongan banjar untuk memanggil warga berkumpul"],["Sekaa","Kelompok kerja: gamelan, tari, pemuda-pemudi (sekaa teruna), pembuat ogoh-ogoh"],["Subak","Organisasi pengairan sawah berlandaskan Tri Hita Karana"]]},
{k:"Seni dan musik",t:"Gamelan: musik yang dimainkan bersama",l:"Gamelan Bali dimainkan berkelompok (sekaa). Ada puluhan jenis, masing-masing punya fungsi dalam upacara.",i:[{q:"Gamelan gong kebyar Bali",c:"Gong kebyar"},{q:"Jegog Jembrana bamboo gamelan",c:"Jegog dari Jembrana"}],c:[["Gong kebyar","Paling populer, bertempo cepat dan dinamis, mengiringi tari dan festival"],["Angklung","Bernada empat, lembut, sering mengiringi upacara kematian dan odalan"],["Selonding dan gambang","Gamelan sakral. Selonding lekat dengan desa Bali Aga seperti Tenganan"],["Jegog dan rindik","Gamelan bambu. Jegog berukuran raksasa khas Jembrana"]],n:"Alat lain: kendang, gangsa, reyong, ceng-ceng, suling, dan kul-kul."},
{k:"Seni tari",t:"Tari Bali: sakral, semi-sakral, hiburan",l:"Tari Bali dibagi tiga kelompok menurut kesakralannya. Ketiga genre ini diakui UNESCO pada 2015.",i:[{q:"Legong dance Bali",c:"Legong"},{q:"Kecak dance Uluwatu",c:"Kecak"},{q:"Barong dance Bali",c:"Barong"}],c:[["Wali (sakral)","Dipentaskan di pura saat upacara: rejang, baris gede, sanghyang"],["Bebali (semi-sakral)","Bagian upacara sekaligus tontonan: topeng, gambuh, wayang wong"],["Balih-balihan (hiburan)","Legong, kecak, joged, oleg tamulilingan"],["Barong dan Rangda","Simbol keseimbangan antara kebaikan dan keburukan"]]},

{k:"Pitra Yadnya",t:"Ngaben: rangkaian upacara kremasi",l:"Ngaben mengembalikan unsur tubuh ke alam dan mengantar roh. Banyak keluarga menunggu hari baik atau ikut ngaben massal.",i:[{q:"Ngaben procession bade Ubud",c:"Arak-arakan bade menuju setra"},{q:"Ngaben cremation lembu Bali",c:"Pembakaran dalam lembu"}],c:[["Memandikan","Jenazah dimandikan dan dirias sebelum disucikan"],["Arak-arakan","Dibawa dalam bade atau wadah menuju setra (kuburan), diiringi baleganjur"],["Pembakaran","Dilakukan di dalam lembu atau patulangan berbentuk hewan suci"],["Nganyut","Abu dilarung ke laut atau sungai, dilanjutkan upacara penyucian roh (nyekah)"]]},
{k:"Manusa Yadnya",t:"Metatah: upacara potong gigi",l:"Disebut juga mepandes. Enam gigi atas diratakan sebagai simbol mengendalikan Sad Ripu, enam musuh dalam diri.",i:[{q:"Metatah tooth filing ceremony Bali",c:"Upacara metatah"},{q:"Mepandes Bali ceremony",c:"Mepandes"}],c:[["Makna","Mengendalikan nafsu, serakah, marah, mabuk, bingung, dan iri hati"],["Siapa","Remaja yang sudah akil balig, biasanya sebelum menikah"],["Prosesi","Gigi diratakan atau dikikis ringan oleh sangging, bukan dicabut"],["Massal","Sering digelar beramai-ramai oleh keluarga atau banjar agar hemat"]]},
{k:"Pawiwahan",t:"Payas agung: busana pengantin adat",l:"Payas agung adalah tata rias dan busana pengantin paling lengkap pada upacara pawiwahan (pernikahan).",i:[{q:"Balinese wedding payas agung",c:"Pengantin dengan payas agung"},{q:"Balinese bride traditional gold headdress",c:"Hiasan kepala emas pengantin"}],c:[["Tiga tingkatan","Agung (paling lengkap), madya (menengah), nista (sederhana), menyesuaikan kemampuan keluarga"],["Perhiasan logam","Badong (kalung lebar), pending (ikat pinggang), gelang kana, gelang naga satru, subeng"],["Kain","Songket, endek, atau prada berbenang emas"],["Perajin","Singapadu, Gianyar, dikenal sebagai sentra kerajinan logam payas agung"]]},
{k:"Payas agung per daerah",t:"Setiap kabupaten punya gaya sendiri",l:"Bali punya delapan kabupaten dan satu kota. Gaya payas agung berbeda di tiap daerah, terutama pada hiasan kepala, kain, dan perhiasan.",i:[{q:"Payas agung Gianyar",c:"Contoh payas agung"},{q:"Payas agung Buleleng",c:"Contoh payas agung"},{q:"Payas agung Karangasem",c:"Contoh payas agung"},{q:"Payas agung Klungkung",c:"Contoh payas agung"}],c:[["Hiasan kepala","Bentuk gelungan dan bunga emas berbeda tiap daerah"],["Kain","Pilihan songket, endek, atau prada mengikuti tradisi setempat"],["Perhiasan","Motif ukiran logam berbeda, misalnya patra punggel dan batun poh pada gaya Gianyar"],["Sembilan wilayah","Jembrana, Tabanan, Badung, Denpasar, Gianyar, Klungkung, Bangli, Karangasem, Buleleng"]]},

{x:"warn",k:"Bagian terpenting",t:"Bukan \"sistem kasta\"!",l:"Yang ada dalam ajaran Hindu adalah Catur Varna: pembagian berdasarkan pekerjaan dan bakat. \"Kasta\" kaku berdasar kelahiran adalah salah kaprah, dibakukan era kolonial Belanda, dan tidak relevan di zaman sekarang.",c:[["Catur Varna","Brahmana, Ksatria, Waisya, Sudra adalah fungsi dan profesi, bukan derajat manusia"],["Wangsa","Garis keturunan dan identitas nama, bukan hak istimewa"],["Hari ini","Semua warga setara. Tidak ada dasar untuk diskriminasi"]]},

const D=document.getElementById("deck"),ct=document.getElementById("ct"),bar=document.getElementById("bar");
const body=s=>`<div class="k">${s.k||""}</div><h2>${s.t}</h2>${s.l?`<p class="l">${s.l}</p>`:""}${s.c?`<div class="g ${s.x==="cmp"?"two":""}">${s.c.map(c=>`<div class="c"><b>${c[0]}</b><p>${c[1]}</p></div>`).join("")}</div>`:""}${s.n?`<p class="n">${s.n}</p>`:""}`;
const fig=a=>`<figure data-q="${a.q}" data-u="${a.u||""}" data-cr="${a.cr||""}"><div class="p0">Memuat foto...</div><figcaption>${a.c}</figcaption></figure>`;
D.innerHTML=S.map(s=>`<section class="s ${s.x||""}${s.i?" ph":""}">${s.i?`<div class="b">${body(s)}</div><div class="fs${s.i.length>1?" m":""}">${s.i.map(fig).join("")}</div>`:body(s)}</section>`).join("");
/* Foto: dicari otomatis dari Wikimedia Commons saat slide dibuka. Untuk foto sendiri, isi u:"img/nama.jpg" dan cr:"Kredit" di data slide. */
const done=new Set();
async function pics(el){
 if(!el||done.has(el))return;done.add(el);
 for(const f of el.querySelectorAll("figure")){
  const box=f.querySelector(".p0"),cap=f.querySelector("figcaption");
  try{
   let url=f.dataset.u,link=null,name=f.dataset.cr;
   if(!url){
    const r=await fetch("https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=10&gsrsearch="+encodeURIComponent(f.dataset.q+" filetype:bitmap")+"&prop=imageinfo&iiprop=url|mime|size|extmetadata&iiurlwidth=1100");
    const j=await r.json();
    const L=Object.values(j.query.pages).sort((a,b)=>a.index-b.index).map(p=>p.imageinfo&&p.imageinfo[0]).filter(Boolean).filter(x=>x.mime==="image/jpeg"),m=L.find(x=>x.width>=900)||L.find(x=>x.width>=500);
    if(!m)throw 0;
    const e=m.extmetadata||{},tmp=document.createElement("div");
    tmp.innerHTML=e.Artist?e.Artist.value:"";
    url=m.thumburl;link=m.descriptionurl;
    name=(tmp.textContent.trim()||"Wikimedia Commons")+(e.LicenseShortName?", "+e.LicenseShortName.value:"");
   }
   const im=new Image();im.alt=cap.textContent;
   im.onload=()=>{box.replaceWith(im)};
   im.onerror=()=>{box.textContent="Foto belum tersedia"};
   im.src=url;
   if(name){cap.append(" - Foto: ");if(link){const a=document.createElement("a");a.href=link;a.target="_blank";a.rel="noopener";a.textContent=name;cap.append(a)}else cap.append(name)}
  }catch(err){box.textContent="Foto belum tersedia"}
 }
}
const E=[...D.children];let i=0;
function go(n){i=Math.max(0,Math.min(E.length-1,n));E.forEach((e,j)=>e.classList.toggle("on",j===i));ct.textContent=(i+1)+" / "+E.length;bar.style.width=((i+1)/E.length*100)+"%";history.replaceState(null,"","#"+(i+1));pics(E[i]);pics(E[i+1])}
document.getElementById("p").onclick=()=>go(i-1);document.getElementById("x").onclick=()=>go(i+1);
addEventListener("keydown",e=>{if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();go(i+1)}if(["ArrowLeft","PageUp"].includes(e.key))go(i-1);if(e.key==="Home")go(0);if(e.key==="End")go(E.length-1)});
let tx=0;addEventListener("touchstart",e=>tx=e.touches[0].clientX);addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>60)go(i+(d<0?1:-1))});
go((parseInt(location.hash.slice(1))||1)-1);
