<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoring Sempadan Pantai Bali - Web GIS</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    #map { height: calc(100vh - 65px); }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased overflow-hidden">

  <!-- Header -->
  <header class="h-[65px] bg-slate-900 text-white px-6 flex items-center justify-between shadow-md z-20 relative">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-lg bg-rose-500/20 border border-rose-500/40 flex items-center justify-center text-rose-400">
        <i class="fa-solid fa-water text-lg"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-tight">Sistem Monitoring Sempadan Pantai Bali</h1>
        <p class="text-xs text-slate-400">Sebaran Pelanggaran Buffer 100m Garis Pantai</p>
      </div>
    </div>
    
    <div class="flex items-center gap-3">
      <input type="file" id="json-file-input" accept=".json" class="hidden" />
      <button onclick="document.getElementById('json-file-input').click()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-md border border-slate-700 transition flex items-center gap-1.5">
        <i class="fa-solid fa-file-code"></i> Pilih JSON Manual
      </button>

      <button onclick="resetMapView()" class="text-xs bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded-md font-medium transition shadow-sm">
        <i class="fa-solid fa-arrows-to-dot mr-1"></i> Reset Peta
      </button>
    </div>
  </header>

  <!-- Layout Utama -->
  <div class="flex flex-col md:flex-row h-[calc(100vh-65px)]">

    <!-- Panel Sidebar -->
    <aside class="w-full md:w-96 bg-white border-r border-slate-200 flex flex-col z-10 shadow-lg md:shadow-none">
      
      <!-- Statistik Ringkas -->
      <div class="p-4 border-b border-slate-100 bg-slate-50/70">
        <div class="grid grid-cols-2 gap-2 text-center">
          <div class="p-2.5 bg-white rounded-lg border border-slate-200 shadow-sm">
            <span class="text-xs text-slate-500 block">Total Ditampilkan</span>
            <span id="stat-total" class="text-xl font-bold text-slate-800">0</span>
          </div>
          <div class="p-2.5 bg-rose-50 rounded-lg border border-rose-200 shadow-sm">
            <span class="text-xs text-rose-600 block">Titik Pelanggaran</span>
            <span id="stat-sempadan" class="text-xl font-bold text-rose-700">0</span>
          </div>
        </div>
      </div>

      <!-- Filter & Search -->
      <div class="p-4 border-b border-slate-200 space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Cari Objek / Lokasi</label>
          <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-400"></i>
            <input 
              id="search-input"
              type="text" 
              placeholder="Cari hotel, Lovina, Sanur, Kuta..."
              class="w-full pl-8 pr-3 py-1.5 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-rose-500/30 focus:border-rose-500"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Filter Tipe Usaha</label>
          <select 
            id="type-filter" 
            class="w-full text-sm rounded-lg border border-slate-300 py-1.5 px-3 focus:outline-none focus:ring-2 focus:ring-rose-500/30 focus:border-rose-500 bg-white"
          >
            <option value="all">Semua Tipe Usaha</option>
            <option value="hotel">Hotel</option>
            <option value="resort">Resort</option>
            <option value="guest_house">Guest House / Villa</option>
            <option value="restaurant">Restaurant</option>
            <option value="bar">Bar / Beach Club</option>
          </select>
        </div>
      </div>

      <!-- List Data -->
      <div class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-2" id="item-list">
        <div class="p-4 text-center text-xs text-slate-400" id="loading-state">
          <i class="fa-solid fa-circle-notch fa-spin text-rose-600 text-lg mb-2 block"></i>
          Memuat titik sempadan...
        </div>
      </div>
      
      <!-- Footer Status -->
      <div class="p-2.5 border-t border-slate-200 text-[11px] text-slate-500 text-center bg-slate-50" id="list-status">
        Memuat data
      </div>
    </aside>

    <!-- Canvas Peta -->
    <main class="flex-1 relative">
      <div id="map" class="w-full h-full"></div>

      <!-- Legenda Merah -->
      <div class="absolute bottom-6 right-6 bg-white/95 backdrop-blur-sm p-3.5 rounded-xl border border-slate-200 shadow-xl z-[1000] text-xs">
        <p class="font-semibold text-slate-700 mb-2 flex items-center gap-1.5">
          <i class="fa-solid fa-circle-exclamation text-rose-600"></i> Status Zonasi
        </p>
        <div class="flex items-center gap-2">
          <span class="w-3.5 h-3.5 rounded-full bg-rose-600 border border-white shadow-sm inline-block"></span>
          <span class="text-slate-700 font-medium">Indikasi Dekat Sempadan Pantai (&lt; 100m)</span>
        </div>
      </div>
    </main>

  </div>

  <script>
    let rawData = [];

    // Inisialisasi peta dengan Canvas renderer agar ribuan titik render instan tanpa lag
    const baliCenter = [-8.5000, 115.1889];
    const map = L.map('map', { 
      zoomControl: false,
      preferCanvas: true 
    }).setView(baliCenter, 10);

    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors | Monitoring Sempadan Bali',
      maxZoom: 19
    }).addTo(map);

    // Layer Group biasa (tanpa cluster)
    const markerLayer = L.layerGroup().addTo(map);

    // Fungsi membuat titik merah
    function createRedMarker(item) {
      const lat = parseFloat(item.Latitude);
      const lng = parseFloat(item.Longitude);

      const marker = L.circleMarker([lat, lng], {
        radius: 4.5,
        fillColor: '#e11d48', // Merah tegas
        color: '#ffffff',     // Outline putih tipis
        weight: 1,
        opacity: 0.9,
        fillOpacity: 0.85
      });

      const popupHtml = `
        <div class="text-xs min-w-[210px] space-y-1.5 p-1 font-sans">
          <div class="pb-1 border-b border-slate-200">
            <span class="font-bold text-slate-800 text-sm leading-tight">${item.Nama_Objek}</span>
          </div>
          <p class="text-slate-500 text-[11px]"><i class="fa-solid fa-location-dot mr-1 text-slate-400"></i>${item.Jalan_Alamat}</p>
          <div class="flex items-center gap-2 pt-1">
            <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-slate-700 text-white uppercase tracking-wider">
              ${item.Tipe_Usaha}
            </span>
          </div>
          <div class="mt-2 p-1.5 rounded bg-rose-50 border border-rose-200 text-rose-700 text-[11px] font-medium flex items-center gap-1.5">
            <i class="fa-solid fa-triangle-exclamation text-rose-500"></i>
            ${item.Status_Sempadan || 'Indikasi Dekat Sempadan Pantai'}
          </div>
        </div>
      `;

      marker.bindPopup(popupHtml);
      return marker;
    }

    function renderFilteredData() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const selectedType = document.getElementById('type-filter').value;

      markerLayer.clearLayers();
      const itemList = document.getElementById('item-list');
      itemList.innerHTML = '';

      const filtered = rawData.filter(item => {
        if (!item.Latitude || !item.Longitude) return false;
        const matchesQuery = (item.Nama_Objek && item.Nama_Objek.toLowerCase().includes(query)) || 
                             (item.Jalan_Alamat && item.Jalan_Alamat.toLowerCase().includes(query));
        const matchesType = (selectedType === 'all') || (item.Tipe_Usaha === selectedType);
        return matchesQuery && matchesType;
      });

      filtered.forEach((item, index) => {
        const marker = createRedMarker(item);
        markerLayer.addLayer(marker);

        // Sidebar merender 60 kartu teratas
        if (index < 60) {
          const card = document.createElement('div');
          card.className = "p-3 bg-white hover:bg-rose-50/50 rounded-xl border border-slate-200 shadow-sm cursor-pointer transition flex flex-col gap-1.5";
          card.innerHTML = `
            <div class="flex items-start justify-between gap-2">
              <h3 class="font-semibold text-xs text-slate-800 leading-snug">${item.Nama_Objek}</h3>
              <span class="w-2.5 h-2.5 rounded-full shrink-0 mt-0.5 bg-rose-600"></span>
            </div>
            <p class="text-[11px] text-slate-500 truncate"><i class="fa-solid fa-location-dot mr-1 text-slate-400"></i>${item.Jalan_Alamat}</p>
            <div class="flex items-center justify-between text-[10px] pt-1">
              <span class="text-slate-600 font-medium uppercase tracking-wider">${item.Tipe_Usaha}</span>
              <span class="text-rose-600 font-semibold bg-rose-50 px-1.5 py-0.5 rounded border border-rose-200">Indikasi Sempadan</span>
            </div>
          `;

          card.onclick = () => {
            const lat = parseFloat(item.Latitude);
            const lng = parseFloat(item.Longitude);
            map.flyTo([lat, lng], 16, { duration: 1 });
            marker.openPopup();
          };

          itemList.appendChild(card);
        }
      });

      document.getElementById('stat-total').innerText = filtered.length.toLocaleString();
      document.getElementById('stat-sempadan').innerText = filtered.length.toLocaleString();

      const listStatus = document.getElementById('list-status');
      if (filtered.length > 60) {
        listStatus.innerText = `Menampilkan 60 kartu dari total ${filtered.length.toLocaleString()} titik merah`;
      } else {
        listStatus.innerText = `Menampilkan seluruh ${filtered.length} titik`;
      }
    }

    function processJSON(data) {
      rawData = data.filter(d => d.Nama_Objek && d.Latitude && d.Longitude);
      renderFilteredData();
      if (rawData.length > 0) {
        const sampleBounds = rawData.map(d => [parseFloat(d.Latitude), parseFloat(d.Longitude)]);
        map.fitBounds(sampleBounds, { padding: [20, 20] });
      }
    }

    // Mengambil dataset JSON otomatis
    fetch('dataset_sempadan_pantai_bali_200plus.json')
      .then(res => {
        if (!res.ok) throw new Error('File JSON tidak ditemukan via fetch');
        return res.json();
      })
      .then(data => {
        processJSON(data);
      })
      .catch(err => {
        document.getElementById('loading-state').innerHTML = `
          <i class="fa-solid fa-folder-open text-rose-600 text-xl mb-2 block"></i>
          <span class="font-medium text-slate-700 block mb-1">Pilih File JSON</span>
          Gunakan tombol <b>Pilih JSON Manual</b> di atas untuk memuat data.
        `;
      });

    // Upload manual cadangan
    document.getElementById('json-file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          try {
            const parsed = JSON.parse(event.target.result);
            processJSON(parsed);
          } catch(err) {
            alert('Format JSON tidak valid.');
          }
        };
        reader.readAsText(file);
      }
    });

    function resetMapView() {
      document.getElementById('search-input').value = '';
      document.getElementById('type-filter').value = 'all';
      renderFilteredData();
      map.flyTo(baliCenter, 10);
    }

    document.getElementById('search-input').addEventListener('input', renderFilteredData);
    document.getElementById('type-filter').addEventListener('change', renderFilteredData);
  </script>
</body>
</html>
